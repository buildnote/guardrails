stages:
  - build
  - deploy

default:
  image: gradle:8.10

image: alpine:3.19

variables:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  REGION: eu-central-1

include:
  - local: .gitlab/shared.yml
  - project: company/templates
    file: build.yml
  - https://example.com/remote.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.template:
  script:
    - echo skipped

build:
  stage: build
  image: gradle:8.10-jdk21
  tags:
    - docker
    - linux
  timeout: 30 minutes
  interruptible: true
  extends:
    - .template
  variables:
    STEP: build
  before_script:
    - ./gradlew --version
  script:
    - ./gradlew check
    - echo "built $CI_COMMIT_SHA on ${CI_COMMIT_BRANCH}"
  after_script:
    - ./cleanup.sh

deploy:
  stage: deploy
  when: manual
  allow_failure: true
  needs:
    - job: build
    - lint
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  secrets:
    DEPLOY_TOKEN:
      vault: production/deploy/token@ops
  script:
    - ./deploy.sh

downstream:
  stage: deploy
  trigger:
    project: company/infra
