name: Deploy
on: push
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      REGION: eu-central-1
      FIXTURE: %s
    steps:
      - name: Log in
        uses: docker/login-action@v3
        with:
          username: robot
          password: %s
      - name: Push
        run: ./deploy.sh
        env:
          API_KEY: ${{ secrets.API_KEY }}
      - name: Clean up
        run: rm -f ./load_secrets.sh config/secrets.yml
