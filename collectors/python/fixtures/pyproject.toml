[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "widget"
version = "1.2.3"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic~=2.6",
  "tomli==2.0.1 ; python_version < \"3.11\"",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.4.4"]

[tool.uv.workspace]
members = ["packages/*"]
